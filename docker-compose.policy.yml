services:
  policy-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mask_policy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mask_policy"]
      interval: 5s
      timeout: 3s
      retries: 10

  policy:
    build:
      context: .
      dockerfile: docker/policy.Dockerfile
    environment:
      SQLMASK_ADMIN_API_KEY: local-admin-key
      SQLMASK_DATA_API_KEY: local-data-key
      POLICY_PG_URL: jdbc:postgresql://policy-postgres:5432/mask_policy
      POLICY_PG_USER: postgres
      POLICY_PG_PASSWORD: postgres
      # no Elasticsearch in this deployment: silence audit connection-refused WARNs
      AUDIT_ENABLED: "false"
    ports:
      - "8081:8081"
    depends_on:
      policy-postgres:
        condition: service_healthy
