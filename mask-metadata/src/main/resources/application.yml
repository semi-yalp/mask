server:
  port: 8082

spring:
  application:
    name: mask-metadata
  datasource:
    url: ${METADATA_PG_URL:jdbc:postgresql://127.0.0.1:5432/mask_metadata}
    username: ${METADATA_PG_USER:postgres}
    # 无默认口令：本地直跑需 export METADATA_PG_PASSWORD，compose 显式注入
    password: ${METADATA_PG_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:metadata-schema.sql

metadata:
  api-key: ${METADATA_API_KEY:}
  # 分面密钥：admin 管 /api/instances/**（含采集），data 管 /api/metadata/**；
  # 未设置时回退到上面的单 key（兼容存量单 key 部署）
  admin-api-key: ${METADATA_ADMIN_API_KEY:}
  data-api-key: ${METADATA_DATA_API_KEY:}
  # 出网守卫：link-local（默认，拒绝 169.254/fe80 云元数据端点）或 off
  network-guard: ${METADATA_NETWORK_GUARD:link-local}

# 审计默认关闭(与 mask-core/mask-query 一致):部署 ES 审计管道时以 AUDIT_ENABLED=true 打开
audit:
  enabled: ${AUDIT_ENABLED:false}
  elasticsearch:
    url: ${AUDIT_ES_URL:http://127.0.0.1:9200}
    api-key: ${AUDIT_ES_API_KEY:}
    username: ${AUDIT_ES_USER:}
    password: ${AUDIT_ES_PASSWORD:}
  index-prefix: ${AUDIT_INDEX_PREFIX:mask-audit}
  queue-capacity: ${AUDIT_QUEUE_CAPACITY:10000}
  batch-size: ${AUDIT_BATCH_SIZE:200}
  flush-interval-ms: ${AUDIT_FLUSH_INTERVAL_MS:2000}
  sql-max-chars: ${AUDIT_SQL_MAX_CHARS:8192}
  effective-pull:
    enabled: ${AUDIT_EFFECTIVE_PULL_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key:
      values:
        application: ${spring.application.name}
