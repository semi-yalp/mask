metadata:
  tables:
    - catalog: crm
      schema: public
      name: customer
      columns:
        - name: id
          type: bigint
        - name: phone
          type: varchar
        - name: email
          type: varchar
        - name: birth_date
          type: date
    - catalog: crm
      schema: public
      name: orders
      columns:
        - name: id
          type: bigint
        - name: customer_id
          type: bigint
        - name: note
          type: varchar
        - name: created
          type: date
        - name: created_at
          type: timestamp

columns:
  - catalog: crm
    schema: public
    table: customer
    column: phone
    policy: phone_mask
  - catalog: crm
    schema: public
    table: customer
    column: email
    policy: email_mask
  - catalog: crm
    schema: public
    table: customer
    column: birth_date
    policy: date_mask

policies:
  phone_mask:
    udf: mask_phone
    arguments: [3, 4]
  email_mask:
    udf: mask_email
    arguments: []
  date_mask:
    udf: mask_date
    arguments: []
