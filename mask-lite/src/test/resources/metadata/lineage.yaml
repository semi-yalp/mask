metadata:
  tables:
    - catalog: crm
      schema: public
      name: customer
      columns:
        - name: id
          type: bigint
        - name: phone
          type: varchar
        - name: email
          type: varchar
        - name: status
          type: varchar
        - name: name
          type: varchar
        - name: address
          type: varchar
        - name: DisplayName
          type: varchar
    - catalog: crm
      schema: public
      name: orders
      columns:
        - name: id
          type: bigint
        - name: customer_id
          type: bigint
        - name: note
          type: varchar
    - catalog: crm
      schema: vip
      name: member
      columns:
        - name: id
          type: bigint
        - name: phone
          type: varchar
        - name: email
          type: varchar

columns:
  - catalog: crm
    schema: public
    table: customer
    column: phone
    policy: phone_mask
  - catalog: crm
    schema: public
    table: customer
    column: email
    policy: email_mask
  - catalog: crm
    schema: public
    table: customer
    column: DisplayName
    policy: display_name_mask
  - catalog: crm
    schema: vip
    table: member
    column: phone
    policy: phone_mask
  - catalog: crm
    schema: vip
    table: member
    column: email
    policy: partial_mask

policies:
  phone_mask:
    udf: mask_phone
    arguments: [3, 4]
  email_mask:
    udf: mask_email
    arguments: []
  display_name_mask:
    udf: mask_name
    arguments: ['*']
  partial_mask:
    udf: partial_mask
    arguments: ['@corp', true, 2.5]
