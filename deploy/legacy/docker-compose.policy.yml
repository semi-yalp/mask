# 本地联调模板。生产部署必须：改用密钥管理注入凭据（勿用 local-* key）、
# 收紧端口绑定、为 policy 前置 TLS。
services:
  policy-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # 强制外部注入，缺省启动失败（本地可 export POLICY_PG_PASSWORD=...）
      POSTGRES_PASSWORD: ${POLICY_PG_PASSWORD:?set POLICY_PG_PASSWORD}
      POSTGRES_DB: mask_policy
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mask_policy"]
      interval: 5s
      timeout: 3s
      retries: 12

  policy:
    build:
      context: .
      dockerfile: docker/policy.Dockerfile
    environment:
      SQLMASK_ADMIN_API_KEY: ${SQLMASK_ADMIN_API_KEY:?set SQLMASK_ADMIN_API_KEY}
      SQLMASK_DATA_API_KEY: ${SQLMASK_DATA_API_KEY:?set SQLMASK_DATA_API_KEY}
      POLICY_PG_URL: jdbc:postgresql://policy-postgres:5432/mask_policy
      POLICY_PG_USER: postgres
      POLICY_PG_PASSWORD: ${POLICY_PG_PASSWORD}
      # no Elasticsearch in this deployment: silence audit connection-refused WARNs
      AUDIT_ENABLED: "false"
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    depends_on:
      policy-postgres:
        condition: service_healthy
