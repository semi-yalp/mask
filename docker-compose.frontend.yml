# 前端（nginx）独立部署：静态页面 + 反向代理到各微服务。
# 依赖策略/元数据/改写服务已在本机运行（镜像内经 host.docker.internal 访问宿主机端口；
# Linux 引擎由下方 extra_hosts 提供 host-gateway 映射）。
services:
  frontend:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
