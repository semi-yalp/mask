name: ci

on: [push, pull_request]

jobs:
  backend:
    name: backend (mvn verify, 10 modules incl. mask-engine/mask-common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21:trino-parser 446 的 class 版本是 65.0(Java 21),JDK 17 无法
          # 读取其测试类路径;产物仍经 maven.compiler.release=17 保持 17 兼容。
          java-version: '21'
          cache: maven
      # `verify` (not just `test`/`package`):
      #  - 全部单测/集成/端到端(含嵌入式 PG 的 QueryEndToEndTest)必须通过;
      #  - shade fat-jar 组装与 META-INF manifest 破损(cf. 944d4a2)必须在这里失败;
      #  - mask-engine 的 enforcer 内核纯度规则(禁 Spring/picocli)必须在这里强制。
      - name: Verify (tests + packages + enforcer)
        run: mvn -B verify

  frontend:
    name: frontend (vitest + vue-tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # package-lock.json 未入库;deploy.sh 的文档化流程即 npm install
      - name: Install, unit-test and build
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
          npm run build
