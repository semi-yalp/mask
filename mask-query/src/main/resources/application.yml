server:
  port: 8083

spring:
  application:
    name: mask-query

# mask-query 无 actuator/MeterRegistry；审计默认 no-op（NoopAuditRecorder），
# 部署 ES 审计管道时以 AUDIT_ENABLED=true 打开（需自带 MeterRegistry）。
audit:
  enabled: ${AUDIT_ENABLED:false}

upstream:
  metadata-base-url: ${SQLMASK_METADATA_BASE_URL:}
  metadata-api-key: ${SQLMASK_METADATA_API_KEY:}
  rewrite-base-url: ${SQLMASK_REWRITE_BASE_URL:}
  rewrite-api-key: ${SQLMASK_REWRITE_API_KEY:}
