metadata:
  tables:
    # filtered + masked: every read is scoped to active customers, phone/email masked
    - catalog: crm
      schema: public
      name: customer
      rowFilter: "status = 'active'"
      columns:
        - {name: id, type: bigint}
        - {name: phone, type: varchar}
        - {name: email, type: varchar}
        - {name: status, type: varchar}
    # filtered + masked: orders scoped to the north region, amount masked
    - catalog: crm
      schema: public
      name: orders
      rowFilter: "region = 'north'"
      columns:
        - {name: id, type: bigint}
        - {name: region, type: varchar}
        - {name: amount, type: decimal}
        - {name: customer_id, type: bigint}
    # masked only: no row filter configured
    - catalog: crm
      schema: public
      name: product
      columns:
        - {name: id, type: bigint}
        - {name: name, type: varchar}
    # filtered only: no policy bound to any column
    - catalog: crm
      schema: public
      name: audit
      rowFilter: "action <> 'secret'"
      columns:
        - {name: id, type: bigint}
        - {name: action, type: varchar}

columns:
  - {catalog: crm, schema: public, table: customer, column: phone, policy: mask_phone}
  - {catalog: crm, schema: public, table: customer, column: email, policy: mask_email}
  - {catalog: crm, schema: public, table: orders, column: amount, policy: mask_amount}
  - {catalog: crm, schema: public, table: product, column: name, policy: mask_name}

policies:
  mask_phone:
    udf: mask_phone
    arguments: [3, 4]
  mask_email:
    udf: mask_email
    arguments: []
  mask_amount:
    udf: mask_amount
    arguments: []
  mask_name:
    udf: mask_name
    arguments: []
