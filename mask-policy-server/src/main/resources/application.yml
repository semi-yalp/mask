server:
  port: 8081
  # 审计 sourceIp 记录真实客户端而非 nginx 地址（nginx 已设置 X-Forwarded-For）
  forward-headers-strategy: framework

spring:
  application:
    name: mask-policy
  datasource:
    url: ${POLICY_PG_URL:jdbc:postgresql://127.0.0.1:5432/mask_policy}
    username: ${POLICY_PG_USER:postgres}
    # 无默认口令：本地直跑需 export POLICY_PG_PASSWORD，compose 显式注入
    password: ${POLICY_PG_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key:
      values:
        application: ${spring.application.name}
