# sql-mask 前端（nginx 部署）配置
#
# 静态资源：frontend/dist（Vite 构建产物；构建见 frontend/deploy.sh 或
#           frontend/ 内 npm run build）。本机 nginx 部署时把 root 改为
#           frontend/dist 的绝对路径。
# 反向代理：按路径前缀路由到各微服务，与页面内的相对 /api/** 调用同源，
#           浏览器无需处理 CORS，X-Api-Key 请求头原样透传。
#
# 路由表（前缀冲突时 nginx 取最长匹配，`location =` 精确匹配优先）：
#   /api/instances、/api/effective                    → mask-policy-server :8081
#   /api/rewrite、/api/audit                          → mask-core          :8080
#     （/api/audit 的查询端点 AuditQueryController 在 mask-core）
#   =/api/metadata/pull                               → mask-core          :8080
#   /api/metadata                                     → mask-metadata      :8082
#   /api/v1/                                          → mask-query         :8083
#
# Docker 部署：见 docker/nginx.Dockerfile 与 nginx.conf.docker（upstream 指向
#   host.docker.internal——容器内 127.0.0.1 指向容器自身）。
#
# TLS：本文件只监听 80 明文；生产部署应在前面加 TLS 终止层（或改本文件
# listen 443 ssl），管理 Key 不应明文穿越不可信网络。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 基础安全响应头（TLS/HSTS 由前置终止层负责）
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # ---- 策略服务 mask-policy-server（8081）：管理面 + 数据面 ----
  location /api/instances {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/effective {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- 改写服务 mask-core（8080）：改写试验台 + 审计查询 ----
  location /api/rewrite {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/audit {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 精确匹配优先：/api/metadata/pull 必须精确路由到 8080，不能落到 /api/metadata
  # location = /api/metadata/pull {
  #   proxy_pass http://127.0.0.1:8080;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # }

  # ---- 元数据服务 mask-metadata（8082）示例（页面经策略服务间接导入，按需开启）----
  # location /api/metadata {
  #   proxy_pass http://127.0.0.1:8082;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # }

  # ---- 查询服务 mask-query（8083）示例（预留）----
  # location /api/v1/ {
  #   proxy_pass http://127.0.0.1:8083;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # }

  # ---- SPA 静态资源与 history 路由回退 ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
