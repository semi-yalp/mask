# sqlmask 前端（nginx 部署）配置 — arch-v2 单体版（本机直跑,upstream 127.0.0.1:8080）
#
# 静态资源：frontend/ 构建产物（Vue3 控制台 SPA）
# 反向代理：arch-v2 起后端是单进程单体（mask-server :8080），全部 /api/**
#           一条规则直指它；与页面的相对 /api/** 调用同源，浏览器无需处理 CORS。
#
# 兼容性：旧的 /api/meta/** 前缀在单体里由后端原生提供（元数据管理面命名
# 空间即 /api/meta/instances），因此无需重写，统一走下面的兜底规则即可。
#
# TLS：本文件只监听 80 明文；生产部署应在前面加 TLS 终止层。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 基础安全响应头（TLS/HSTS 由前置终止层负责）
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # ---- 单体后端 mask-server（8080）：全部 API ----
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- 静态页面（SPA 深链回退）----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
